[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain-openai>=0.3",
    "langgraph>=1.2.9",
    "pinecone>=9.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "sqlglot>=30.12.0",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.4.3",
    # ragas==0.4.3 unconditionally imports langchain_community.chat_models.vertexai
    # at module load time (backend/.venv/Lib/site-packages/ragas/llms/base.py),
    # but that module was removed from langchain-community as part of its
    # "sunset" deprecation (VertexAI moved to langchain-google-vertexai) --
    # ragas declares NO version constraint on langchain-community, so an
    # unpinned install resolves the latest (0.4.x) and breaks. Pinned to the
    # last pre-sunset release that still has the module. No newer ragas
    # release exists yet (0.4.3 is latest on PyPI as of this pin) -- revisit
    # this pin if ragas ships a fix.
    "langchain-community==0.3.31",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
